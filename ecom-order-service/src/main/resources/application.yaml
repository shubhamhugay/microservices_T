spring:
  application:
    name: ecom-order-service

server:
  port: 8080

logging:
  level:
    com.rogerstore.ecomorderservice.client: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  ratelimiter:
    configs:
      default:
        # The number of permissions available during one limit refresh period
        limit-for-period: 2

        # The period after which the permissions count resets
        limit-refresh-period: 10s

        # Maximum time a thread waits for permission before failing
        timeout-duration: 0s

        # Register the rate limiter health indicator
        # register-health-indicator: true

        # Event consumer buffer size
        # event-consumer-buffer-size: 100

  circuitbreaker:
    instances:
      inventoryServiceCircuitBreaker:

        # Sliding Window Configuration
        sliding-window-type: COUNT_BASED # TIME_BASED or COUNT_BASED
        sliding-window-size: 6 # Check the last 6 calls
        minimum-number-of-calls: 5 # Minimum calls required before calculating failure rate

        # Failure Threshold
        failure-rate-threshold: 50

        # Open State Configuration
        wait-duration-in-open-state: 10s

        # Half Open Configuration
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true

        # Exceptions to record as failures
        record-exceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException

        # Exceptions to ignore
        ignore-exceptions:
          - java.lang.IllegalArgumentException

  timelimiter:
    instances:
      inventoryServiceTimeLimiter:
        timeout-duration: 2s
        cancel-running-future: true