spring:
  application:
    name: ecom-order-service

server:
  port: 8080

logging:
  level:
    com.rogerstore.ecomorderservice.client: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  ratelimiter:
    configs:
      default:
        # The number of permissions available during one limit refresh period
        limit-for-period: 2
        # The period of a limit refresh. After each period, the rate limiter sets its permissions count back to the limit-for-period value
        limit-refresh-period: 10s
        # The default wait time a thread waits for a permission before failing
        timeout-duration: 0s
        # Configures whether the rate limiter should register the health indicator
#        register-health-indicator: true
        # Configures whether event consumer buffer size
#        event-consumer-buffer-size: 100
  circuitbreaker:
    instances:
      inventoryServiceCircuitBreaker:

        # Sliding Window Configuration
        sliding-window-type: COUNT_BASED #time /count based
        sliding-window-size: 6 #check last 10 calls
        minimum-number-of-calls: 5 # m

        # Failure Threshold
        failure-rate-threshold: 50


        # Open State Configuration
        wait-duration-in-open-state: 10s

        # Half Open Configuration
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true

        record-exceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException

        ignore-exceptions:
          - java.lang.IllegalArgumentException